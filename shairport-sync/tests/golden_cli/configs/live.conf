general = {
  // distinct mDNS name and UDP port range so the golden tests can run while the
  // real shairport-sync daemon is up (it owns the default name and UDP 6001-6010)
  name = "GoldenCli";
  udp_port_base = 56001;
  udp_port_range = 10;
};
sessioncontrol = {
  daemon_pid_dir = "/tmp/shairport-golden-cli";
};
