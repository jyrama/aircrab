name: ci

on:
  push:
    branches: [main, 'vibe/**']
  pull_request:

permissions:
  contents: read

jobs:
  harness:
    name: abi + nqptp harness (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - name: shm ABI copies in sync
        run: ./abi/check-sync.sh
      - name: nqptp shm/control harness
        run: ./nqptp/harness/run.sh check

  shairport-build:
    name: shairport-sync build + CLI smoke (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: canidae-solutions/lix-quick-install-action@v5
        with:
          lix_version: "2.95.2"
          lix_conf: |
            experimental-features = nix-command flakes
            substituters = https://cache.lix.systems https://cache.nixos.org
            trusted-public-keys = cache.lix.systems:aBnZUw8zA7H35Cz2RyKFVs3H4PlGTLawyY5KRbvJR8o= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: lix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('shell.nix') }}
          restore-prefixes-first-match: lix-${{ runner.os }}-${{ runner.arch }}-
      - name: Build with nix-shell (root shell.nix) and smoke-test the CLI
        run: nix-shell --run ./ci/build-and-smoke.sh
      - name: Golden CLI tests via goldplate (when goldplate.d is populated)
        run: |
          if ls shairport-sync/tests/golden_cli/goldplate.d/*.goldplate >/dev/null 2>&1; then
            cp build-ci/shairport-sync/shairport-sync shairport-sync/tests/golden_cli/goldplate.d/shairport-sync-bin
            nix-shell --run 'goldplate shairport-sync/tests/golden_cli/goldplate.d'
          else
            echo "no goldplate cases yet -- run tests/golden_cli/gen-goldplate.sh and 'goldplate --fix' on the reference machine"
          fi
